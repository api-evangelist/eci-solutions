- aid: eci-solutions:eci-solutions-integration-management
  name: ECI MFG Integration Management API
  description: 'Management plane for the ECI Manufacturing Integration Engine: companies, API users and
    credentials, connections, integrations and integration settings, applications, devices, reports, telemetry
    and per-integration rate-limit configuration. Authenticates with an OpenID Connect id_token from the
    ECI Amazon Cognito user pool or with an API key over HTTP Basic. Enforces a documented rate limit
    of 500 requests per minute per source IP.'
  humanURL: https://integrations.ecimanufacturing.com/api.html?id=management-v1
  baseURL: https://api-user.integrations.ecimanufacturing.com
