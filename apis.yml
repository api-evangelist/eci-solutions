- aid: eci-solutions:eci-solutions-financial
  name: ECI Financial Integration API
  description: Accounting-system integration for ECI ERP products. v1 integrates QuickBooks Online, MYOB,
    Xero and Sage; v2 integrates Xero and ECI Financials and covers purchase, sales and general ledger
    flows. v2 is the only ECI contract that declares 429 Too Many Requests and 501 Not Implemented responses
    with an RFC 7807-shaped Problem body.
  humanURL: https://integrations.ecimanufacturing.com/
  baseURL: https://api-fin.integrations.ecimanufacturing.com
