- aid: eci-solutions:eci-solutions-lasso-crm
  name: Lasso CRM API
  description: The public API for Lasso CRM, ECI's new-home-sales CRM (acquired with Lasso Data Systems
    and sold under ecisolutions.com/products/lasso-crm). Manages registrants, their contact information,
    notes, questions, appointments, relationships, assigned sales reps and history, plus projects and
    inventory with plan types and pricing revisions. Bearer JWT API keys are issued per project or location;
    a 1,000 request-per-minute limit applies per key, and a registrant webhook event system pushes inserted/updated/deleted
    events to registered integrations.
  humanURL: https://platform.lassocrm.com/api/
