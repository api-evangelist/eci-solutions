- aid: eci-solutions:eci-solutions-authentication
  name: ECI Authentication API
  description: Common authentication endpoints for every ECI Manufacturing Integration Engine API. Issues
    60-minute OAuth 2.0 client-credentials access tokens for API users; there is no refresh token, so
    callers re-present the client id and secret. Enforces a documented rate limit of 100 requests per
    minute per source IP. The OpenID Connect discovery document is published on the ECI Cognito user pool.
  humanURL: https://integrations.ecimanufacturing.com/authenticate.html
  baseURL: https://api-user.integrations.ecimanufacturing.com
