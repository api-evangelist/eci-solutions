apis:
- aid: eci-solutions:eci-solutions-platform
  name: ECI Manufacturing ERP API
  description: A product-agnostic REST API for reading and writing data in ECI ERP products, currently
    supporting Deacom, M1, Macola and JobBOSS². The API user account determines which ERP product, customer
    and database instance is reached. Supports field selection, filter expressions, sort expressions,
    take/skip paging, relationship expansion and a rowVersion change cursor. Three concurrent versions
    are published (v1, v2, v2.1); OAuth 2.0 client-credentials tokens are issued by the Integration Engine
    Management API. Access must be activated by ECI before use.
  humanURL: https://integrations.ecimanufacturing.com/api.html?family=erp
  baseURL: https://api-erp.integrations.ecimanufacturing.com
  tags:
