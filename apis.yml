- aid: eci-solutions:eci-solutions-m1
  name: M1 Public API
  description: The M1 ERP public REST API for hosted M1 customers, exposing roughly 1,200 operations across
    inventory, financial, CRM, production, quality, purchase orders, shipping, employee, sales orders,
    quotations, BOM and general ERP resources. OAuth 2.0 client-credentials with API users issued from
    the Integration Engine Management Console; supports M1Field[operator] filter expressions and pageSize
    paging, and returns both JSON and XML representations.
  humanURL: https://integrations.ecimanufacturing.com/api.html?family=m1
