aid: eci-solutions
name: ECI Solutions
description: 'ECI Software Solutions (ECI Solutions) is a global provider of industry-specific cloud business
  management software for small and medium-sized manufacturers, building-supply and industrial distributors,
  residential construction and trade contractors, field service organizations, and office technology /
  managed print dealers. Its portfolio spans ERP (JobBOSS², M1, Deacom, Macola, ProfitKey, Ridder iQ,
  Bemet, Spruce, DDMSPLUS, RockSolid MAX, e-automate, Khameleon), e-commerce (EvolutionX, Spruce eCommerce),
  CRM (Lasso, Sales Simplicity), payments (NET1), analytics (Cognytics, Lojic, Acsellerate) and MES/APS.
  ECI publishes a real, anonymously readable API program: the ECI Manufacturing Integration Engine at
  integrations.ecimanufacturing.com serves seventeen OpenAPI 3.0.1 contracts covering a product-agnostic
  ERP API plus JobBOSS², M1, authentication, integration management, payments, financial, e-commerce,
  e-invoicing, shipping, currency, AP/AR commerce, Office 365 and notification services, and Lasso CRM
  publishes its own OpenAPI 3.0.2 contract at platform.lassocrm.com. API activation itself is gated behind
  an ECI account manager.'
