- aid: eci-solutions:eci-solutions-jobboss2
  name: JobBOSS² Public API
  description: The JobBOSS²-specific REST API for cloud-hosted JobBOSS² customers, covering orders and
    order line items, order routings, quotes and quote line items, customers, contacts, shipping addresses,
    estimates and part master, materials and material issues, time tickets, employees and vendors. Uses
    bearer tokens from the Integration Engine OAuth 2.0 client-credentials flow, take/skip paging, fields/filter/sort
    expressions, and a Title/Status/Detail/TraceId JSON error envelope.
  humanURL: https://integrations.ecimanufacturing.com/api.html?family=jb2
