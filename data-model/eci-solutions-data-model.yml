source: >-
  openapi/eci-solutions-erp-v2-1-openapi.json (129 component schemas) and
  openapi/eci-solutions-lasso-crm-openapi.yml, read via $ref links and *ID reference fields
provider: ECI Solutions
providerId: eci-solutions
note: >-
  The ECI Manufacturing ERP API is the canonical model — it is the product-agnostic projection ECI
  built over Deacom, M1, Macola and JobBOSS², so its 129 schemas describe the shape ECI itself
  considers common across four ERPs. Lasso CRM is an unrelated domain (new-home sales) and is
  modelled separately. Relationships below were read from declared $ref links and from *ID fields
  whose target entity is itself a schema in the same contract; nothing is inferred from prose.
identity:
  primary_key_field: uniqueID
  note: >-
    Unique per resource per company account, NOT globally unique. Underlying type varies by backing
    ERP — Macola GUID, M1 GUID, JobBOSS² Int32. Entities additionally carry a domain key
    (jobID, partID, quoteID, salesOrderID, organizationID …). rowVersion (int64, monotonic) is the
    change cursor for incremental sync.
  id_prefixes: none
  id_prefix_note: >-
    ECI does not use typed id prefixes. An id is bare, so a client cannot tell a partID from a
    jobID by looking at it.
domains:
  - name: Manufacturing ERP
    api: eci-solutions:eci-solutions-platform
    entities:
      - name: Organization
        description: The party record — a customer, a supplier, or both. The root of the commercial graph.
        relationships:
          - has_many: Location
            via: organizationID
          - has_many: Contact
            via: organizationID
          - has_many: OrganizationPart
            via: organizationID
          - belongs_to: PaymentTerm
            via: customerPaymentTermID, supplierPaymentTermID
          - belongs_to: TaxCode
            via: customerTaxCodeID, supplierTaxCodeID
          - belongs_to: SalesAccount
            via: salesAccountID
      - name: Part
        description: The item master. Everything manufactured, bought or sold hangs off it.
        relationships:
