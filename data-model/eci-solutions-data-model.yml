traversal:
  detail: >-
    The ERP API is the only ECI surface that can traverse these relationships in one call, via
    expand=relationship(fields=…), nestable — e.g.
    /api/v2.1/view/timecardlines?expand=timecard(expand=employee). Everywhere else a client joins
    client-side on the *ID fields above.
gaps:
  - No JSON Schema, JSON-LD or vocabulary artifact is published by ECI; the component schemas inside each OpenAPI are the only formal model.
  - No id prefixes, so ids are not self-describing.
  - The same entity has different names across the estate (ERP Organization vs AP/AR Commerce Customer and Vendor vs Financial v2 Supplier), and no crosswalk is published.
