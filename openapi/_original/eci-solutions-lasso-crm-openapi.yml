      name: inventoryId
      schema:
        type: string
      required: true
      description: "/inventory/123/sync"
    put:
      tags:
      - Inventory
      summary: Sync an inventory
      operationId: 'put_inventory_sync'
      description: >-
        Syncs an inventory item with Lasso. This can only be done once, afterwards
        Lasso will reject any subsequent PUT request with a 409 error. This is done
        to prevent accidental data loss in Lasso, as certain items may not be included
        in the sync data.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventorySync'
      security:
      - JwtAuthorizer: []
      responses:
        200:
          description: Inventory updated
          content:
