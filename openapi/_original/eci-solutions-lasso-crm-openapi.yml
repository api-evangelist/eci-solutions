          description: Inventory created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryRead'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        409:
          $ref: '#/components/responses/ErrorInventoryAlreadySynced'
        500:
          $ref: '#/components/responses/InternalServerError'
  '/inventory/{inventoryId}':
    parameters:
    - in: path
      name: inventoryId
      schema:
        type: string
      required: true
      description: "/inventory/123"
    get:
      tags:
      - Inventory
      summary: Get a single inventory
      operationId: 'get_inventory_by_id'
      security:
      - JwtAuthorizer: []
      responses:
        200:
          description: Return an inventory item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryFull'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        500:
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
      - Inventory
      summary: Update an inventory
      operationId: 'put_inventory'
      description: >-
        Updates an inventory. Note that this will overwrite all of the inventory's
        information with the entity provided in the request payload. To avoid accidentally
        deleting existing information, first perform a GET on the same resource, then
        modify the returned entity, then finally apply the entity through this PUT
        method.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryUpdate'
      security:
      - JwtAuthorizer: []
      responses:
        200:
          description: Inventory updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryRead'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/ErrorInventoryAlreadySynced'
        500:
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
      - Inventory
      summary: Delete an inventory
      operationId: 'delete_inventory'
      description: >-
        Deletes an inventory, in order to remove an inventory it must have a status
        of "Available" and not be "locked"
      security:
      - JwtAuthorizer: []
      responses:
        204:
          description: Inventory deleted
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        409:
          $ref: '#/components/responses/ErrorInventoryCannotBeDeleted'
        500:
          $ref: '#/components/responses/InternalServerError'
  '/inventory/{inventoryId}/sync':
