    StandardError:
      type: object
      title: Standard Error
      description: >-
        A standard error response format.
      properties:
        errorCode:
          type: integer
          example: 4xx
        error:
          type: string
          description: A summary of the error
          example: A summary of the error
        errorMessage:
          type: string
          description: Details of the error
          example: Details of the error
    RegistrantWebhookEvent:
      title: Registrant Webhook Event
      type: object
      description: >
        This format describes a webhook event that is fired off to an external system
        when an action is performed on a registrant. It is an envelope that wraps
        the RegistrantRead entity, as well as containing additional metadata.
      properties:
        timestamp:
          type: string
          format: datetime
          example: '2017-08-31T21:18:39Z'
          description: the time of the event in ISO 8601 UTC format
        id:
          type: string
          example: '123'
          description: >-
            The Lasso registrantId. This is useful in case the enclosed entity is
            null (ie, on a deleted event)
        externalId:
          type: string
          example: '345'
          description: >-
            The external integrated system's ID associated to this registrant. This
            is the same externalId found in RegistrantRead.externalId. This is useful
            in case the enclosed entity is null (ie, on a deleted event)
        action:
          type: string
          enum:
          - inserted
          - deleted
          - updated
          example: 'updated'
          description: >-
            Describes the action that took place on the registrant that triggered
            this event. On 'inserted' and 'updated', the 'entity' field will be set.
            On 'deleted', the 'entity' field will not be set.
        customParams:
          type: array
          description: >-
            Static custom values that are passed through from the webhook configuration.
            These values are manually set on the webhook configuration page. They
            can be useful for mapping a webhook event to a specific value that's meaningful
            in another system. For example, if the external system has the concept
            of a "community", then a unique community ID can be set at the Lasso project-level
            webhook configuration. Then, any events on registrants to that project
            will propagate this unique community ID with the webhook event. The external
            system could then use this community ID to map the event to.
          items:
            type: object
            properties:
              key:
                type: string
                example: 'communityId'
              value:
                type: string
                example: '12345'
        changed:
          type: array
          description: >-
            On update events, lists the RegistrantRead field names that triggered
            this webhook. Empty on inserted and deleted events. Only the following
            field names may appear: person, rating, excludeFromTraffic, registrationDate,
            followUpProcess, sourceType, secondarySourceType, questions, notes, assignedSalesReps,
            history. Changes to person include personal info, emails, phones, addresses,
            and relationships. Internal metadata changes (status, LastModified, activities,
            emailOptedStatus) trigger webhooks but are not included in this list.
          items:
            type: string
          example:
          - person
          - rating
        entity:
          $ref: '#/components/schemas/RegistrantRead'
    RegistrantWrite:
      title: RegistrantWrite
      type: object
      properties:
        websiteTracking:
          type: object
          properties:
            domainAccountId:
              type: string
              example: 'LAS-123456-01'
            guid:
              type: string
              example: UID123
        excludeFromTraffic:
          type: boolean
          description: Exclude this registrant from traffic reports
          example: false
        registrationDate:
          type: string
          format: datetime
          description: When the registrant was created in the system. Dates are in
            ISO 8601 UTC format.
          example: '2017-08-31T21:18:39Z'
        externalId:
          type: string
          example: 'ABC123'
          description: >-
            identifies this registrant in an externally linked system. The external
            system is determined from the api key
        externalDuplicateIds:
          type: array
          description: >-
            a registrant that has been merged with another will inherit the other's
            externalId. This list keeps track of all other externalId's linked to
            this single registrant
          items:
            type: string
            example: "DEF456"
        person:
          $ref: '#/components/schemas/RegistrantPersonalInfo'
        rating:
          $ref: '#/components/schemas/Rating'
        sourceType:
          $ref: '#/components/schemas/SourceType'
        secondarySourceType:
          $ref: '#/components/schemas/SecondarySourceType'
        followUpProcess:
          $ref: '#/components/schemas/FollowUpProcess'
        assignedSalesReps:
          type: array
          items:
            $ref: '#/components/schemas/SalesRepWrite'
        questions:
          type: array
          items:
            $ref: '#/components/schemas/Question'
        emails:
          type: array
          items:
            $ref: '#/components/schemas/EmailWrite'
        phones:
          type: array
          items:
            $ref: '#/components/schemas/PhoneWrite'
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/AddressWrite'
        history:
          type: array
          items:
            $ref: '#/components/schemas/HistoryWrite'
        notes:
          type: array
          items:
            $ref: '#/components/schemas/RegistrantNoteWrite'
        sendSalesRepAssignmentNotification:
          type: boolean
          example: true
        thankYouEmailTemplateId:
          type: string
          example: 123
        sendOptInEmail:
          type: boolean
          example: true
        rotationId:
          type: string
          description: >-
            Assign a sales rep from next in rotation. assignedSalesReps override rotationId
          example: 1
        automaticallyMerge:
          type: boolean
          example: true
          description: "Set this directive to true to tell the system to look for\
            \ and merge this new lead with an existing\nduplicate registrant. Defaults\
            \ to true if not set. \n\nA duplicate registrant will be matched according\
            \ to these criteria: (in order of precedence)\n- Match by personalId provided\
            \ in `RegistrantWrite.personalId`\n- Match by email provided in `RegistrantWrite.emails[].email`\
            \ (if multiple emails, then match at least one)\n- Match by phone provided\
            \ in `RegistrantWrite.phones[].phone` (if multiple phones, then match\
            \ at least one)\n"
        _links:
          $ref: '#/components/schemas/RegistrantLinks'
