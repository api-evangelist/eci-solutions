components:
  schemas:
    Registrant:
      title: Registrant
      type: object
      properties:
        websiteTracking:
          type: object
          properties:
            domainAccountId:
              type: string
              example: 'LAS-123456-01'
            guid:
              type: string
              example: UID123
        excludeFromTraffic:
          type: boolean
          description: Exclude this registrant from traffic reports
          example: false
        registrationDate:
          type: string
          format: datetime
          description: When the registrant was created in the system. Dates are in
            ISO 8601 UTC format.
          example: '2017-08-31T21:18:39Z'
        externalId:
          type: string
          example: 'ABC123'
          description: >-
            identifies this registrant in an externally linked system. The external
            system is determined from the api key
        externalDuplicateIds:
          type: array
          description: >-
            a registrant that has been merged with another will inherit the other's
            externalId. This list keeps track of all other externalId's linked to
            this single registrant
          items:
            type: string
            example: "DEF456"
        person:
          $ref: '#/components/schemas/RegistrantPersonalInfo'
        rating:
          $ref: '#/components/schemas/Rating'
        sourceType:
          $ref: '#/components/schemas/SourceType'
        secondarySourceType:
          $ref: '#/components/schemas/SecondarySourceType'
        followUpProcess:
          $ref: '#/components/schemas/FollowUpProcess'
        assignedSalesReps:
          type: array
          items:
            $ref: '#/components/schemas/SalesRepWrite'
        questions:
          type: array
          items:
            $ref: '#/components/schemas/Question'
    RegistrantRead:
      title: RegistrantRead
      type: object
      properties:
        websiteTracking:
          type: object
          properties:
            domainAccountId:
              type: string
              example: 'LAS-123456-01'
            guid:
              type: string
              example: UID123
        excludeFromTraffic:
          type: boolean
          description: Exclude this registrant from traffic reports
          example: false
        registrationDate:
          type: string
          format: datetime
          description: When the registrant was created in the system. Dates are in
            ISO 8601 UTC format.
          example: '2017-08-31T21:18:39Z'
        externalId:
          type: string
          example: 'ABC123'
          description: >-
            identifies this registrant in an externally linked system. The external
            system is determined from the api key
        externalDuplicateIds:
          type: array
          description: >-
            a registrant that has been merged with another will inherit the other's
            externalId. This list keeps track of all other externalId's linked to
            this single registrant
          items:
            type: string
            example: "DEF456"
        person:
          $ref: '#/components/schemas/RegistrantPersonalInfo'
        rating:
          $ref: '#/components/schemas/Rating'
        sourceType:
          $ref: '#/components/schemas/SourceType'
        secondarySourceType:
          $ref: '#/components/schemas/SecondarySourceType'
        followUpProcess:
          $ref: '#/components/schemas/FollowUpProcess'
        assignedSalesReps:
          type: array
          items:
            $ref: '#/components/schemas/SalesRepWrite'
        questions:
          type: array
          items:
            $ref: '#/components/schemas/Question'
        registrantId:
          type: string
          example: 123
        project:
          $ref: '#/components/schemas/Project'
        emails:
          type: array
          items:
            $ref: '#/components/schemas/EmailRead'
        phones:
          type: array
          items:
            $ref: '#/components/schemas/PhoneRead'
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/AddressRead'
        history:
          type: array
          items:
            $ref: '#/components/schemas/HistoryRead'
        notes:
          type: array
          items:
            $ref: '#/components/schemas/RegistrantNoteRead'
        relationships:
          type: array
          items:
            $ref: '#/components/schemas/RegistrantRelationshipRead'
        appointments:
          type: array
          items:
            $ref: '#/components/schemas/AppointmentRead'
        _links:
          $ref: '#/components/schemas/RegistrantLinks'
    RegistrantAccepted:
      type: object
      title: RegistrantAccepted
      properties:
        registrantId:
          type: string
          example: 123
        messages:
          type: array
          items:
            $ref: '#/components/schemas/RegistrantCreateMessage'
        _links:
          $ref: '#/components/schemas/RegistrantLinks'
    RegistrantCreateMessage:
      type: object
      title: RegistrantCreateMessage
      properties:
        message:
          type: string
          description: contains a message describing warnings and errors during processing
          example: 'Warning: first name is greater than max size 20 and will be truncated'
    RegistrantLinks:
      type: object
      properties:
        self:
          type: string
          description: Link to the registrant
          example: '/registrants/123'
        update:
          type: string
          description: Link to update the registrant
          example: '/registrants/123'
    RegistrantPersonalInfo:
      type: object
      title: Registrant Personal Info
      required:
      - firstName
      - lastName
      properties:
        personalId:
          type: string
          example: 1234
          description: >-
            Providing a personalId when creating a new registrant will attempt to
            match and automatically merge the new registrant with an existing duplicate
        nameTitle:
          type: string
          example: Mrs
        firstName:
          type: string
          example: Jane
        lastName:
          type: string
          example: Doe
        company:
          type: string
          example: First Contracting
        contactPreference:
          type: string
          description: How the registrant would like to be contacted
          enum:
          - noPreference
          - any
          - email
          - mail
          - phone
          - text
          - noEmail
          - noContact
          example: any
        gender:
          type: string
          enum:
          - unspecified
          - male
          - female
          example: female
        nickname:
          type: string
          example: Jane
        birthday:
          type: string
          description: Contains only the month and day.
          example: '08/14'
        ssnSin:
          type: string
          description: >-
            The social insurance number or social security number. Please ensure that
            you are allowed to collect this information in your jurisdiction.
          example: '046 454 286'
    Project:
      title: Project
      type: object
      properties:
        name:
          type: string
          example: 'Birch Towers'
        projectId:
          type: string
          example: 123
    Rating:
      type: object
      title: Rating
      description: If rating does not exist, it will be created
      properties:
        rating:
          type: string
          minLength: 1
          maxLength: 50
          example: A
    SourceType:
      type: object
      title: Source Type
      description: If the source type doesn't exist, it will be created
      properties:
        sourceType:
          type: string
          minLength: 1
          maxLength: 100
          example: 'Online Registration'
    SecondarySourceType:
      type: object
      title: Secondary Source Type
      description: If the secondary source type does not exist, it will be created
      properties:
        secondarySourceType:
          type: string
          minLength: 1
          maxLength: 100
          example: 'Facebook'
    FollowUpProcess:
      type: object
      title: Follow-up Process
      description: >-
        If `followUpProcessId` is provided, the system will attempt to lookup the
        process by id, and fail if not found. If `followUpProcessId` is not provided,
        but `followUpProcess` is instead provided, the system will then attempt to
        lookup the process by value. If the value doesn't exist, it will be created
      properties:
        followUpProcessId:
          type: string
          example: 1
        followUpProcess:
          type: string
          minLength: 1
          maxLength: 20
          example: '30 day follow up'
    ExternalId:
      type: object
      title: External ID
      required:
      - externalId
      description: >-
        Integration externalId associated with a registrant in Lasso
      properties:
        externalId:
          type: string
          example: '123ABC'
    EmailRead:
      type: object
      title: Email Read
      properties:
        emailId:
          type: string
          example: 123
        email:
          type: string
          example: 'test_registrant@lassocrm.com'
        type:
          type: string
          example: 'Personal'
        primary:
          type: boolean
          example: true
        optedStatus:
          type: string
          enum:
          - opted_in
          - opted_out
          - non_opted
          example: opted_in
    PhoneRead:
      type: object
      title: Phone Read
      properties:
        phoneId:
          type: string
          example: 123
        phone:
          type: string
          example: '123-456-7890'
        type:
          type: string
          example: 'Mobile'
        primary:
          type: boolean
          example: true
    AddressRead:
      type: object
      title: Address Read
      properties:
        addressId:
          type: string
          example: 123
        address:
          type: string
          example: '350 Fifth Avenue'
        city:
          type: string
          example: 'New York'
        country:
          type: string
          example: 'USA'
        state:
          type: string
          example: 'NY'
        zipCode:
          type: string
          example: '10118'
        type:
          type: string
          example: 'Mobile'
        primary:
          type: boolean
          example: true
    SalesRep:
      type: object
      title: SalesRep Generic Model
      properties:
        userId:
          type: string
          example: 123
        firstName:
          type: string
          example: Lasso
        lastName:
          type: string
          example: Autobot
        isPrimary:
          type: boolean
          example: true
    SalesRepWrite:
      type: object
      title: SalesRep Write Model
      description: |
        When inputting a salesRep, you can provide a userId and the system
        will try to look up the salesRep by the ID.

        If no userId is provided but a first and last name are, then
        the system will lookup the salesRep by name and assign it to this registrant.

        Otherwise, no salesRep will be assigned.

        Notes:
        - if multiple salesReps are being assigned, take care to only
          choose one to be primary. If multiple are designated as primary, an error will
          be returned
        - on registrant create, if both rotationId and assignedSalesReps are specified,
          assignedSalesReps will override rotationId in salesRep selection.
      properties:
        userId:
          type: string
          example: 123
        firstName:
          type: string
          example: Lasso
        lastName:
          type: string
          example: Autobot
        isPrimary:
          type: boolean
          example: true
    SalesRepRead:
      type: object
      title: SalesRep Read Model
      description: >-
        Describes a sales rep, typically assigned to a set of registrants.
      properties:
        userId:
          type: string
          example: 123
        firstName:
          type: string
          example: Lasso
        lastName:
          type: string
          example: Autobot
        isPrimary:
          type: boolean
          example: true
    Question:
      type: object
      title: Question
      description: |
        Questions in Lasso are sorted into folders. You can use `path` to
        specify which folder the question should be saved to.

        Specifying the questionId will override name and path and the
        question will be looked up by its ID. If no question is found the
        question is *not* created and the request fails.

        Any existing registrant answers to the question will be replaced by the
        answers from this request. Existing answer options on the question will
        not be removed.

        If the question does not exist and no question ID is provided, a new
        question will be created. If the path is empty, the question will be
        created in a folder named after the API key vendor type - ie, `lassoLeadCapture`.

        The possible answer options are created for each answer provided in the
        `answer` key. Only question type `checkbox` supports multiple answers. All
        of them will be marked as checked for the registrant.
      properties:
        questionId:
          type: string
          description: >-
            Specifies precisely which question
          example: 123
        type:
          type: string
          description: |
            If the question does not exist, this defines which type of question is
            going to be created. Defaults to type `Text`. Available types are:
            - Checkbox
              Multiple possible answers, and multiple set answers
            - Text
              Only one possible answer which is freeform text
            - Date
              Only one possible answer, a date in the ISO 8601 UTC format
            - Single Select
              Only one possible answer from a set of answers
            - Multi Select
              Multiple possible answers from a set of answers
          enum:
          - checkbox
          - text
          - single_select
          - multi_select
          - date
          example: checkbox
        name:
          type: string
          example: How did you hear about us?
          maxLength: 100
        path:
          type: string
          description: >-
            Specify which folder the question is in. Format: `/folder/subfolder`.
            If no path is given, the `integrations` folder will be used.
          example: /marketing/inbound
          maxLength: 40
        answers:
          type: array
          items:
            $ref: '#/components/schemas/Answer'
    Answers:
      type: object
      title: Question Answers
      description: Represents a collection of answers for a question
      properties:
        answers:
          type: array
          items:
            $ref: '#/components/schemas/Answer'
    Answer:
      type: object
      title: Question Answer
      description: Represents an answer for a question for the registrant
      properties:
        answerId:
          type: string
          description: >-
            Specifies the answer by id. If present, `answer` will be ignored. If no
            answer matches `answerId` the answer will be looked-up by its answer string.
          example: 123
        answer:
          type: string
          description: >-
            If no `answerId` is given, the answer will be looked-up by its answer
            string. If no answer with the given answer string exists, the answer will
            be created.
          example: 'Recommended by a friend'
    HistoryWithoutContent:
      type: object
      description: >-
        History tracks communication with the registrant. Various types of history
        items are supported, e.g. emails, phone call or appointments. The content
        for history items is limited to the first 200 characters, as emails may grow
        very large and include embedded content (e.g. images) that makes transferring
        all history content at once unfeasible. If you need the full content for any
        given history item, you can request it from the `self` link.
      properties:
        type:
          type: string
          description: >
            Clients can create their own history types, so an exhaustive list of available
            history items is currently not available. Defaults:

            Appointment Cancelled Appointment Email Email Reply Fax Mail Mass Mail
            Merge Opted-Out Phone - Left Message Return Visit SSRU Visit
          example: Email
        typeId:
          type: string
          description: ID of the history type (could be client-created)
          example: 123
        subject:
          type: string
          description: Short summary of history item
          example: 'Welcome to Birch Towers'
        date:
          type: string
          format: datetime
          description: When the history item was received, e.g. send-date for email
          example: '2017-08-31T21:18:39Z'
        createdBy:
          $ref: '#/components/schemas/Creator'
        _links:
          type: object
          properties:
            self:
              type: string
              example: '/registrants/123/history/123'
    HistoryRead:
      type: object
      title: History Read Item
      properties:
        type:
          type: string
          description: >
            Clients can create their own history types, so an exhaustive list of available
            history items is currently not available. Defaults:

            Appointment Cancelled Appointment Email Email Reply Fax Mail Mass Mail
            Merge Opted-Out Phone - Left Message Return Visit SSRU Visit
          example: Email
        typeId:
          type: string
          description: ID of the history type (could be client-created)
          example: 123
        subject:
          type: string
          description: Short summary of history item
          example: 'Welcome to Birch Towers'
        date:
          type: string
          format: datetime
          description: When the history item was received, e.g. send-date for email
          example: '2017-08-31T21:18:39Z'
        createdBy:
          $ref: '#/components/schemas/Creator'
        _links:
          type: object
          properties:
            self:
              type: string
              example: '/registrants/123/history/123'
        historyId:
          type: string
          example: 123
    RegistrantNoteRead:
      type: object
      title: Note Read
      description: Contains a free-form text field
      properties:
        noteId:
          type: string
          example: 123
        note:
          type: string
          example: Offer a $10.000 credit
        createdBy:
          $ref: '#/components/schemas/Creator'
        _links:
          $ref: '#/components/schemas/RegistrantNoteLinks'
    RegistrantNoteLinks:
      type: object
      properties:
        delete:
          type: string
          example: '/registrants/123/notes/123'
    RegistrantRelationshipRead:
      type: object
      title: Relationship Read
      description: Contains a registrant's relationships
      properties:
        relationshipId:
          type: string
          example: 123
        registrantId:
          type: string
          example: 456
        relationship:
          type: string
          example: Wife
        reverse:
          type: string
          example: Husband
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
    Creator:
      type: object
      title: Creator
      description: |
        Determines the user that created this entity based on an ordered set of Heuristics:
        - if creator is null or empty, then default to user: Lasso Autobot
        - if userId is provided, then lookup user by id, respond with 400 level error if specified user does not exist
        - if user first and last name are provided, then lookup user by name, otherwise default to user: Lasso Autobot
      properties:
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Smith
        userId:
          type: string
          example: 123
    EmailTemplateMetadata:
      type: object
