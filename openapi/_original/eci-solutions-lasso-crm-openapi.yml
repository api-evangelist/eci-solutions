        Page Limit: 1000 appointments per page is the maximum and also the default page limit if no initial cursor is specified.
      tags:
      - Project Appointments
      parameters:
      - $ref: '#/components/parameters/Cursor'
      security:
      - JwtAuthorizer: []
      responses:
        200:
          description: >-
            Fetches a list of appointments, sorted newest-first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectAppointments'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        500:
          $ref: '#/components/responses/InternalServerError'
  /inventory/search:
    get:
      summary: 'Search inventories by strataLot and inventoryNumber.'
      operationId: 'get_inventory_search'
      description: >-
        This endpoint is optimized for speed with a smaller payload than `/inventory`.
        This is handy for live search features, e.g. a drop-down with suggested results
        for a search bar.
      tags:
      - Inventory
      parameters:
      - name: strataLot
        in: query
        schema:
          type: string
        description: '/inventory/search?strataLot=123'
      - name: inventoryNumber
        in: query
        schema:
          type: string
        description: '/inventory/search?inventoryNumber=123'
      security:
      - JwtAuthorizer: []
      responses:
        200:
          description: Inventories found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryRead'
        400:
          $ref: '#/components/responses/BadRequest'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        500:
          $ref: '#/components/responses/InternalServerError'
  /inventory:
    get:
      summary: 'Returns a list of all inventories'
      operationId: 'get_inventory'
      tags:
      - Inventory
      security:
      - JwtAuthorizer: []
      responses:
        200:
          description: Inventories found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryRead'
        401:
          $ref: '#/components/responses/Unauthorized'
        403:
          $ref: '#/components/responses/Forbidden'
        500:
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Inventory
      summary: Create an inventory
      operationId: 'post_inventory_search'
      description: >-
        Creates an inventory, if no component is specified the default is used.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryCreate'
      security:
      - JwtAuthorizer: []
      responses:
