        _links:
          $ref: '#/components/schemas/RegistrantLinks'
    Appointment:
      type: object
      title: Appointment
      description: >-
        Describes the basic details of a scheduled appointment.

        Limitations: Note that only the appointment's registrant as well as their
        assigned sales reps are described here. Additional attendee information that
        is not described here, are those that were sent out calendar invites, as well
        as any SMS text message reminder recipients.
      properties:
        name:
          type: string
          example: 'Design Center Selections'
        description:
          type: string
          example: 'Come on in and make it yours'
        details:
          type: string
          example: 'Appointment to make selection'
        startTime:
          type: string
          format: datetime
          description: When the appointment is scheduled to start. Datetimes are in
            ISO-8601 UTC format.
          example: '2019-01-31T18:30:00Z'
        endTime:
          type: string
          format: datetime
          description: When the appointment is scheduled to end. Datetimes are in
            ISO-8601 UTC format.
          example: '2019-01-31T19:30:00Z'
        location:
          type: string
          example: '4601 US-377, Brownwood, TX 76801, United States'
        isPublic:
          type: boolean
          example: false
        status:
          type: string
          enum:
          - Open
          - Tentative
          - Confirmed
          - Cancelled
          - Completed
          - No Show
    AppointmentEmailConfirmationRecipient:
