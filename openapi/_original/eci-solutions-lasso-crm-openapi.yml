  responses:
    Forbidden:
      description: The provided authentication credentials does not have sufficient
        privileges to access this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
    NotFound:
      description: The specified resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
    Unauthorized:
      description: The request has not been fulfilled because it lacks valid authentication
        credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
    BadRequest:
      description: |
        The request could not be processed due to invalid input:
        - Is the request payload malformed?
        - Are all required fields present?
        - Are field values of the expected type (ie, number format, date format)?
        - Are field values within the expected constraints (ie, greater than max size of string)?
        - Are query params of the expected format?

        Check the body model for more documentation on field constraints and limits.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
    InternalServerError:
      description: Receiving a 5xx response indicates an error on Lasso's end. Please
        contact us to report the problem
    ErrorInventoryCannotBeDeleted:
      description: The inventory you tried to delete was either "locked" or its status
        is not "Available"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
    ErrorInventoryAlreadySynced:
      description: |
        The inventory item you tried to create or sync with Lasso already exists
        or is already synced. Right now, it is only possible to sync an inventory
        item with Lasso once. Any subsequent changes will have to be applied
        manually (ie, adding a note)

        Alternatively, you can reset the inventory and sync again. Resetting
        the inventory will remove any associated information (ie, deposits,
        notes, etc). Any information that is not included in the sync will be
        lost. In addition, there may be issues with custom reports that inspect
        the system creation date of data (this is not related to dates included
        in the sync, like the deposit received date). If you choose to reset
        and sync the inventory, please ensure that you are not deleted data
        in Lasso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardError'
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: >-
        A cursor for the next batch of registrants is providing in the metadata of
        the body. Provide the `next` cursor as a query parameter in your next request
        to access the next batch of registrants.

        It's a base64 encoded json object with the fields `v` for version, `o` for
        offset and `l` for limit. You don't have to create the cursor object as it
        is embedded in the `next` link provided in the result set.

        Version is an integer that indicates the layout of the cursor. Future layouts
        may provide a different way to access parts of a result set, e.g. by providing
        a primary key as a reference point. This prevents the missing/repeated data
        issue with paged results, if the result set is modified during paging (e.g.
        a registrant is added while on page 2, and when loading page 3, the last registrant
        from page is pushed down to be the first registrant on page three and being
        included in two result pages. The opposite happens if a registrant is deleted,
        one result will be skipped.)
  securitySchemes:
    JwtAuthorizer:
      type: http
      scheme: bearer
      bearerFormat: JWT
