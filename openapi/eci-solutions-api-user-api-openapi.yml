components:
  schemas:
    UpdateApiUserRequestModel:
      required:
      - firstName
      - username
      type: object
      properties:
        username:
          minLength: 1
          type: string
        firstName:
          minLength: 1
          type: string
        lastName:
          type:
          - string
          - 'null'
        email:
          type:
          - string
          - 'null'
        keyIds:
          type:
          - array
          - 'null'
          items:
            type: integer
            format: int32
        isPasswordChanged:
          type: boolean
        companyId:
          type: integer
          format: int32
        financialCompanyId:
          type: integer
          format: int32
        userType:
          type: integer
          format: int32
        expireType:
          type: integer
          format: int32
        days:
          type:
          - integer
          - 'null'
          format: int32
        expireDateTime:
          type:
          - string
          - 'null'
        environment:
          type:
          - string
          - 'null'
      additionalProperties: false
    ValidationError:
      type: object
      properties:
        field:
          type:
          - string
          - 'null'
        message:
          type:
          - string
          - 'null'
      additionalProperties: false
    AuthenticateUserResponseAPIResponse:
      type: object
      properties:
        version:
          type:
          - string
          - 'null'
        statusCode:
          type: integer
          format: int32
        message:
          type:
          - string
          - 'null'
        responseException:
          allOf:
          - $ref: '#/components/schemas/ApiError'
        result:
          allOf:
          - $ref: '#/components/schemas/AuthenticateUserResponse'
      additionalProperties: false
    ApiUserResponseModelAPIResponse:
      type: object
      properties:
        version:
          type:
          - string
          - 'null'
        statusCode:
          type: integer
          format: int32
        message:
          type:
          - string
          - 'null'
