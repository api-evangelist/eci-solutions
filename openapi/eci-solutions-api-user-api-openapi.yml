          format: int32
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/TestConnectionRequestModel'
          text/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/TestConnectionRequestModel'
          application/*+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/TestConnectionRequestModel'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TestConnectionResponseModelAPIResponse'
            application/json:
