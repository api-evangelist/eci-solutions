components:
  schemas:
    CTMPartGroupsDto:
      type: object
      properties:
        partGroups:
          type: array
          items:
            $ref: '#/components/schemas/PartGroupDto'
    PartClassDto:
      required:
      - partClassID
      - description
      type: object
      properties:
        partClassID:
          type: string
        description:
          type: string
    CTMWarehouseBinsDto:
      type: object
      properties:
        warehouseBins:
          type: array
          items:
            $ref: '#/components/schemas/WarehouseBinDto'
    APIResponseMessageDto:
      type: object
      properties:
        description:
          type: string
        status:
          type: string
        payloadID:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
          readOnly: true
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
          readOnly: true
    WarehouseDto:
      required:
      - warehouseID
      - name
      type: object
      properties:
        warehouseID:
          type: string
        name:
          type: string
        plantID:
          type: string
        defaultWarehouse:
          type: boolean
    WorkCenterDto:
      required:
      - workCenterID
      - description
      type: object
      properties:
        workCenterID:
          type: string
        description:
          type: string
    ProcessDto:
      required:
      - processID
      - shortDescription
      type: object
      properties:
        processID:
          type: string
        shortDescription:
          type: string
    Warning:
      type: object
      properties:
        innerText:
          type: string
    WarehouseBinDto:
      required:
      - warehouseID
      - warehouseBinID
      - description
      type: object
      properties:
        warehouseID:
          type: string
        warehouseBinID:
          type: string
        description:
          type: string
        defaultBin:
          type: boolean
    PartGroupDto:
      required:
      - partGroupID
      - description
      type: object
      properties:
        partGroupID:
          type: string
        description:
          type: string
    CTMProcessDto:
      type: object
      properties:
        processes:
          type: array
          items:
            $ref: '#/components/schemas/ProcessDto'
    Error:
      type: object
      properties:
        innerText:
          type: string
    CTMWorkCenterDto:
      type: object
      properties:
        workCenters:
          type: array
          items:
            $ref: '#/components/schemas/WorkCenterDto'
    CTMWarehousesDto:
      type: object
      properties:
        warehouses:
          type: array
          items:
            $ref: '#/components/schemas/WarehouseDto'
    CTMPartClassesDto:
      type: object
      properties:
        partClasses:
          type: array
          items:
            $ref: '#/components/schemas/PartClassDto'
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth 2.0 Client Credentials Flow with API Users issued from Integration Engine Management Console
      flows:
        clientCredentials:
          tokenUrl: https://api-user.integrations.ecimanufacturing.com/oauth2/api-user/token
          scopes:
            openid: openid
