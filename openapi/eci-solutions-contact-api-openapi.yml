  /api/contact:
    post:
      tags:
      - Contact
      summary: Creates a Paya contact
      description: '### Creates a Paya Contact


        Creating a contact is the first step to enabling payment processing for a customer. A contact represents an individual or entity within the Paya system.


        #### Why create a contact?

        - **Store Payment Methods:** Once a contact is created, you can securely save their payment methods (credit cards, bank accounts) in a Paya "Account Vault".

        - **Process Transactions:** With a stored payment method, you can easily process future transactions like sales, refunds, or authorizations without requiring the customer to re-enter their details.

        - **Streamline Billing:** It is essential for recurring billing, subscriptions, and providing a quick checkout experience for returning customers.


        This endpoint captures the necessary customer information to establish their record in the Paya gateway.'
      requestBody:
        description: An object containing the details of the contact to be created, such as name, email, and address.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Contact_2'
          text/json:
            schema:
              $ref: '#/components/schemas/Contact_2'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Contact_2'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/StringAPIResponse_2'
            application/json:
              schema:
                $ref: '#/components/schemas/StringAPIResponse_2'
            text/json:
              schema:
                $ref: '#/components/schemas/StringAPIResponse_2'
      operationId: postApiContact
      x-operation-id-source: derived
    get:
      tags:
      - Contact
      summary: Gets contact details
      description: '### Gets contact details

        This API shows all details of a desired contact.'
      parameters:
      - name: contactId
        in: query
        description: This field contains the desired contact ID.
        required: true
        schema:
          type: string
      - name: developerId
        in: query
        description: This field contains the desired developer ID.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ContactAPIResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ContactAPIResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ContactAPIResponse'
      operationId: getApiContact
      x-operation-id-source: derived
