        phoneNumber||M1, JobBOSS², Macola

        emailAddress||M1, JobBOSS², Macola

        isActive||M1, JobBOSS², Macola

        comments||JobBOSS²'
      parameters:
      - name: id
        in: path
        description: The ID of the contact
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
