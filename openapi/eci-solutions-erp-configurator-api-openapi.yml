components:
  schemas:
    ERPPartRuleDto:
      required:
      - pcrField
      - pcrMethodID
      - pcrMethodType
      type: object
      properties:
        pcrCode:
          type: string
        pcrCreatedBy:
          type: string
        pcrCreatedDate:
          type: string
          format: date-time
        pcrUniqueID:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000000
        pcrField:
          type: string
        pcrMethodAssemblyID:
          type: integer
          format: int32
        pcrMethodID:
          type: string
        pcrMethodMaterialID:
          type: integer
          format: int32
        pcrMethodOperationID:
          type: integer
          format: int32
        pcrMethodRevisionID:
          type: string
        pcrMethodType:
          type: integer
          format: int32
        pcrProcessSequence:
          type: integer
          format: int32
        pcrRowVersion:
          type: integer
          format: int64
    APIResponseMessageDto:
      type: object
      properties:
        description:
          type: string
        status:
          type: string
        payloadID:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
          readOnly: true
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
          readOnly: true
    ERPResponseMessageDto_ERPPartRuleDto:
      type: object
      properties:
        responseInfo:
          $ref: '#/components/schemas/APIResponseMessageDto'
        returnObject:
          $ref: '#/components/schemas/ERPPartRuleDto'
        recordCount:
          type: integer
          format: int32
    ERPResponseMessageDto_IList_ERPPartRuleDto:
      type: object
      properties:
        responseInfo:
          $ref: '#/components/schemas/APIResponseMessageDto'
        returnObject:
          type: array
          items:
            $ref: '#/components/schemas/ERPPartRuleDto'
        recordCount:
          type: integer
          format: int32
    Error:
      type: object
      properties:
        innerText:
          type: string
    Warning:
      type: object
      properties:
        innerText:
          type: string
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth 2.0 Client Credentials Flow with API Users issued from Integration Engine Management Console
      flows:
        clientCredentials:
          tokenUrl: https://api-user.integrations.ecimanufacturing.com/oauth2/api-user/token
          scopes:
            openid: openid
