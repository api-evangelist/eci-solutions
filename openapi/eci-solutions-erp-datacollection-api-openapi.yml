  /api/ERP/Timecards/Batch:
    post:
      tags:
      - ERP/DATACOLLECTION
      summary: Submits a timecard record in batch mode for processing by the ERP system
      description: 'This endpoint receives timecard information and enqueues it into the `InternetTransactionQueue` (ITQ) table.


        After being saved, a background worker will later pick up the ITQ record and process it asynchronously,

        applying additional business logic and persisting the data in the ERP system.


        The payload must include a valid employee ID, timecard date, shift ID, and a list of one or more timecard lines.

        Each line should describe job-related information including process and work center details.


        ### Authorization:

        A valid API key with write access is required to use this endpoint.'
      operationId: ERPTimecards_BatchTimecardAsync
      requestBody:
        description: The timecard data submitted from the Integration Engine.
        content:
          text/json:
            schema:
              $ref: '#/components/schemas/MesTimecardDto'
          application/json:
            schema:
              $ref: '#/components/schemas/MesTimecardDto'
        required: true
        x-bodyName: timecard
      responses:
        '200':
          description: OK
          content:
            text/json:
              schema:
                type: object
            application/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
            text/xml:
              schema:
                type: object
        '201':
          description: Created
          content:
            text/json:
              schema:
                $ref: '#/components/schemas/ERPResponseMessageDto_MesIntegrationTransactionQueueInformationDto'
            application/json:
