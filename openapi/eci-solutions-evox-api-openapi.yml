openapi: 3.2.0
info:
  title: Ecommerce. Evo X API
  version: '1.0'
security:
- Bearer: []
tags:
- name: EvoX
paths:
  /api/v1/evox/erp-customer-balance-lookup:
    post:
      tags:
      - EvoX
      summary: Get live customer A/R balances from the ERP
      operationId: RequestCustomerBalanceLookup
      requestBody:
        description: A model containing the customer account for which to request the A/R balance.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErpCustomerBalanceRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ErpCustomerBalanceRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ErpCustomerBalanceRequest'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErpCustomerBalanceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErpCustomerBalanceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErpCustomerBalanceResponse'
  /api/v1/evox/erp-customer-lookup:
    post:
      tags:
      - EvoX
      summary: Get customer live from the ERP
      operationId: ErpCustomerLookup
      requestBody:
        description: A model containing the customer account for which to request customer.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErpCustomerLookupRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ErpCustomerLookupRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ErpCustomerLookupRequest'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErpCustomerLookupResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErpCustomerLookupResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErpCustomerLookupResponse'
  /api/v1/evox/erp-inventory-lookup:
    post:
      tags:
      - EvoX
      summary: Get inventory items from the ERP
      operationId: RequestErpInventoryLookup
      requestBody:
        description: A model containing the customer account and list of items sku for which to request inventory items.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErpProductInventoryRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ErpProductInventoryRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ErpProductInventoryRequest'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErpProductInventoryListResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErpProductInventoryListResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErpProductInventoryListResponse'
  /api/v1/evox/erp-invoice-document-lookup:
    post:
      tags:
      - EvoX
      summary: Get an invoice document from the ERP
      operationId: ErpInvoiceDocument
      requestBody:
        description: A model containing the customer account and document information to look up.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErpInvoiceDocumentRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ErpInvoiceDocumentRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ErpInvoiceDocumentRequest'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErpInvoiceDocumentResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErpInvoiceDocumentResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErpInvoiceDocumentResponse'
  /api/v1/evox/erp-invoice-lookup-by-id:
    post:
      tags:
      - EvoX
      summary: Get invoice by id from the ERP
      operationId: ErpInvoiceLookupById
      requestBody:
        description: A model containing the customer account and invoice id for which to get invoice information.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErpInvoiceLookupByIdRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ErpInvoiceLookupByIdRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ErpInvoiceLookupByIdRequest'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErpInvoiceLookupByIdResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErpInvoiceLookupByIdResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErpInvoiceLookupByIdResponse'
  /api/v1/evox/erp-invoice-lookup:
    post:
      tags:
      - EvoX
      summary: Get Invoices from the ERP
      operationId: LookupErpInvoiceHistory
      requestBody:
        description: A model containing the customer account and start and end date filters for which to request orders.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErpInvoiceHistoryRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ErpInvoiceHistoryRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ErpInvoiceHistoryRequest'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErpInvoiceHistoryResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErpInvoiceHistoryResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErpInvoiceHistoryResponse'
  /api/v1/evox/erp-order-lookup-by-id:
    post:
      tags:
      - EvoX
      summary: Get customer order by id from the ERP
      operationId: LookupErpOrderHistoryById
      requestBody:
        description: A model containing the customer account and sellere reference and order id for which to request order.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErpOrderHistoryByIdRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ErpOrderHistoryByIdRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ErpOrderHistoryByIdRequest'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErpOrderHistoryByIdResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErpOrderHistoryByIdResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErpOrderHistoryByIdResponse'
  /api/v1/evox/erp-order-lookup:
    post:
      tags:
      - EvoX
      summary: Get customer orders from the ERP
      operationId: LookupErpOrderHistory
      requestBody:
        description: A model containing the customer account and start and end date filters for which to request orders.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErpOrderHistoryRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ErpOrderHistoryRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ErpOrderHistoryRequest'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErpOrderHistoryResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErpOrderHistoryResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErpOrderHistoryResponse'
  /api/v1/evox/erp-pricing-lookup:
    post:
      tags:
      - EvoX
      summary: Get live item pricing from the ERP
      operationId: RequestErpPricingLookup
      requestBody:
        description: A model containing the customer account and list of item SKUs for which to request pricing.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErpProductPricingRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ErpProductPricingRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ErpProductPricingRequest'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErpProductPricingListResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErpProductPricingListResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErpProductPricingListResponse'
  /api/v1/evox/erp-purchased-product-lookup:
    post:
      tags:
      - EvoX
      summary: Get live recent purchased items from the ERP
      operationId: LookupErpPurchasedProducts
      requestBody:
        description: A model containing the customer account and start and end date filters for which to request recent purchased items.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErpPurchasedProductRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ErpPurchasedProductRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ErpPurchasedProductRequest'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErpPurchasedProductListResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErpPurchasedProductListResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErpPurchasedProductListResponse'
  /api/v1/evox/erp-shipping-method-lookup:
    post:
      tags:
      - EvoX
      summary: Get checkout shipping methods from the ERP
      operationId: ErpShippingMethodLookup
      requestBody:
        description: A model containing the customer account and list of items for which to request shipping method information.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErpShippingMethodRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ErpShippingMethodRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ErpShippingMethodRequest'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ShippingMethodResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingMethodResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ShippingMethodResponse'
  /api/v1/evox/erp-tax-lookup:
    post:
      tags:
      - EvoX
      summary: Get checkout tax from the ERP
      operationId: ErpCheckoutTaxLookup
      requestBody:
        description: A model containing the customer account and list of item SKUs for which to request tax information.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErpCheckoutTaxRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ErpCheckoutTaxRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ErpCheckoutTaxRequest'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErpCheckoutTaxResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErpCheckoutTaxResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErpCheckoutTaxResponse'
  /api/v1/evox/process-order-payment:
    post:
      tags:
      - EvoX
      summary: Submit a payment for an existing order to the ERP for processing
      operationId: ProcessErpOrderPayment
      requestBody:
        description: A model containing the order payment details necessary for processing by the ERP.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErpProcessCustomerOrderPaymentRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ErpProcessCustomerOrderPaymentRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ErpProcessCustomerOrderPaymentRequest'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErpOrderPaymentCreateResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErpOrderPaymentCreateResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErpOrderPaymentCreateResponse'
  /api/v1/evox/process-order:
    post:
      tags:
      - EvoX
      summary: Submit a created order to the ERP for processing
      operationId: ProcessErpOrder
      requestBody:
        description: A model containing the created order details necessary for processing by the ERP.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErpProcessOrderRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ErpProcessOrderRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ErpProcessOrderRequest'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErpProcessOrderResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErpProcessOrderResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErpProcessOrderResponse'
components:
  schemas:
    OrderShippingDetails:
      type: object
      properties:
        customer_code:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        address1:
          type:
          - string
          - 'null'
        address2:
          type:
          - string
          - 'null'
        address3:
          type:
          - string
          - 'null'
        city:
          type:
          - string
          - 'null'
        state:
          type:
          - string
          - 'null'
        postal_code:
          type:
          - string
          - 'null'
      additionalProperties: false
    ErpInvoiceHistoryRequest:
      required:
      - customer_code
      type: object
      properties:
        customer_code:
          minLength: 1
          type: string
        seller_reference:
          type:
          - string
          - 'null'
        filters:
          $ref: '#/components/schemas/ErpInvoiceFilterRequest'
        current_page:
          type:
          - string
          - 'null'
        per_page:
          type:
          - string
          - 'null'
      additionalProperties: false
    ErpInvoiceDocumentResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/InvoiceData'
      additionalProperties: false
    ErpProductInventoryListResponse:
      type: object
      properties:
        products:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ErpProductResponseData'
      additionalProperties: false
    OrderBillingDetails:
      type: object
      properties:
        customer_code:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        address1:
          type:
          - string
          - 'null'
        address2:
          type:
          - string
          - 'null'
        address3:
          type:
          - string
          - 'null'
        city:
          type:
          - string
          - 'null'
        state:
          type:
          - string
          - 'null'
        postal_code:
          type:
          - string
          - 'null'
      additionalProperties: false
    ShippingAddress:
      type: object
      properties:
        address_code:
          type: integer
          format: int32
        name:
          type:
          - string
          - 'null'
        address1:
          type:
          - string
          - 'null'
        address2:
          type:
          - string
          - 'null'
        address3:
          type:
          - string
          - 'null'
        city:
          type:
          - string
          - 'null'
        state:
          type:
          - string
          - 'null'
        postal_code:
          type:
          - string
          - 'null'
        country:
          type:
          - string
          - 'null'
      additionalProperties: false
    ErpProductInventory:
      type: object
      properties:
        item_sku:
          type:
          - string
          - 'null'
      additionalProperties: false
    ErpOrderPaymentCreateResponse:
      type: object
      properties:
        customer_code:
          type:
          - string
          - 'null'
        seller_reference:
          type:
          - string
          - 'null'
        payments_applied:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ErpOrderPaymentAppliedPayment'
      additionalProperties: false
    ShippingMethods:
      type: object
      properties:
        label:
          type:
          - string
          - 'null'
        fixed_rate:
          type:
          - number
          - 'null'
          format: double
        total:
          type:
          - string
          - 'null'
      additionalProperties: false
    Lines:
      type: object
      properties:
        item_sku:
          type:
          - string
          - 'null'
        line_amount:
          type:
          - number
          - 'null'
          format: double
        qty:
          type:
          - number
          - 'null'
          format: double
      additionalProperties: false
    ErpCheckoutTaxResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Data'
      additionalProperties: false
    ErpProcessOrderRequestDataObjectShippingData:
      type: object
      properties:
        id:
          type:
          - integer
          - 'null'
          format: int32
        title:
          type:
          - string
          - 'null'
        label:
          type:
          - string
          - 'null'
        supplier_id:
          type:
          - integer
          - 'null'
          format: int32
        items_count:
          type:
          - integer
          - 'null'
          format: int32
        weight:
          type:
          - number
          - 'null'
          format: double
        subtotal:
          type:
          - number
          - 'null'
          format: double
        tax:
          type:
          - number
          - 'null'
          format: double
        total:
          type:
          - number
          - 'null'
          format: double
      additionalProperties: false
    ErpProductInventoryRequest:
      required:
      - products
      type: object
      properties:
        customer_code:
          type:
          - string
          - 'null'
        products:
          type: array
          items:
            $ref: '#/components/schemas/ErpProductInventory'
      additionalProperties: false
    ErpOrderHistoryRequest:
      required:
      - customer_code
      type: object
      properties:
        customer_code:
          minLength: 1
          type: string
        seller_reference:
          type:
          - string
          - 'null'
        filters:
          $ref: '#/components/schemas/ErpProductOrderFilterRequest'
        current_page:
          type:
          - string
          - 'null'
        per_page:
          type:
          - string
          - 'null'
      additionalProperties: false
    Request:
      type: object
      properties:
        header:
          $ref: '#/components/schemas/Header'
        branch:
          $ref: '#/components/schemas/Branch'
        lines:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Lines'
      additionalProperties: false
    TrackingInformation:
      type: object
      properties:
        carrier_account_number:
          type:
          - string
          - 'null'
        delivery_charge:
          type:
          - string
          - 'null'
        delivery_date:
          type:
          - string
          - 'null'
          format: date-time
        shipping_date:
          type:
          - string
          - 'null'
          format: date-time
        status:
          type:
          - string
          - 'null'
        status_time:
          type:
          - string
          - 'null'
          format: date-time
        weight:
          type:
          - string
          - 'null'
        note:
          type:
          - string
          - 'null'
        tracking_number:
          type:
          - string
          - 'null'
        tracking_url:
          type:
          - string
          - 'null'
      additionalProperties: false
    ErpPurchasedProductFilterRequest:
      type: object
      properties:
        start_date:
          type:
          - string
          - 'null'
          format: date-time
        end_date:
          type:
          - string
          - 'null'
          format: date-time
      additionalProperties: false
    ErpInvoiceLookupByIdRequest:
      required:
      - customer_code
      - invoice_id
      type: object
      properties:
        customer_code:
          minLength: 1
          type: string
        seller_reference:
          type:
          - string
          - 'null'
        invoice_id:
          minLength: 1
          type: string
      additionalProperties: false
    InvoiceData:
      type: object
      properties:
        customer_code:
          type:
          - string
          - 'null'
        file_base64:
          type:
          - string
          - 'null'
      additionalProperties: false
    ErpProcessOrderRequestDataObject:
      required:
      - customer
      - items
      type: object
      properties:
        id:
          type:
          - integer
          - 'null'
          format: int32
        customer:
          $ref: '#/components/schemas/ErpProcessOrderRequestDataObjectCustomer'
        branch:
          $ref: '#/components/schemas/ErpProcessOrderRequestDataObjectBranch'
        currency:
          type:
          - string
          - 'null'
        note:
          type:
          - string
          - 'null'
        po_reference:
          type:
          - string
          - 'null'
        alternative_po:
          type:
          - string
          - 'null'
        shipping_amount:
          type:
          - number
          - 'null'
          format: double
        total:
          type:
          - number
          - 'null'
          format: double
        tax:
          type:
          - number
          - 'null'
          format: double
        payment:
          $ref: '#/components/schemas/ErpProcessOrderPaymentRequest'
        shipping:
          $ref: '#/components/schemas/ErpProcessOrderRequestDataObjectShipping'
        items:
          $ref: '#/components/schemas/ErpProcessOrderRequestDataObjectItems'
      additionalProperties: false
    ErpProcessOrderRequestDataGateway:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        customer:
          type:
          - string
          - 'null'
        token:
          type:
          - string
          - 'null'
        authorization:
          type:
          - string
          - 'null'
        card_type:
          type:
          - string
          - 'null'
        card_last4:
          type:
          - string
          - 'null'
        card_exp_month:
          type:
          - integer
          - 'null'
          format: int32
        card_exp_year:
          type:
          - integer
          - 'null'
          format: int32
      additionalProperties: false
    ErpProcessOrderPaymentRequestOrders:
      required:
      - order_id
      - total
      type: object
      properties:
        order_id:
          minLength: 1
          type: string
          description: The ID of the order in the ERP system.
        total:
          type: number
          description: The total amount of the payment that should be applied to this order.
          format: double
      additionalProperties: false
    ErpProductResponseData:
      type: object
      properties:
        item_sku:
          type:
          - string
          - 'null'
        uom:
          type:
          - string
          - 'null'
        inventory:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ErpProductInventoryResponseData'
      additionalProperties: false
    InvoiceShippingDetails:
      type: object
      properties:
        customer_id:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        address1:
          type:
          - string
          - 'null'
        address2:
          type:
          - string
          - 'null'
        address3:
          type:
          - string
          - 'null'
        city:
          type:
          - string
          - 'null'
        state:
          type:
          - string
          - 'null'
        postal_code:
          type:
          - string
          - 'null'
      additionalProperties: false
    ErpShippingMethodRequest:
      required:
      - customer_code
      type: object
      properties:
        customer_code:
          minLength: 1
          type: string
        seller_reference:
          type:
          - string
          - 'null'
        address1:
          type:
          - string
          - 'null'
        address2:
          type:
          - string
          - 'null'
        address3:
          type:
          - string
          - 'null'
        city:
          type:
          - string
          - 'null'
        state:
          type:
          - string
          - 'null'
        country:
