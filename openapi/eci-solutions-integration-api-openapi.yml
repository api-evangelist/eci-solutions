    SystemsDataModel:
      type: object
      properties:
        id:
          type: integer
          format: int32
        systemName:
          type:
          - string
          - 'null'
        isActive:
          type: boolean
        canBeCreatedByAdmin:
          type: boolean
        vendorName:
          type:
          - string
          - 'null'
        vendorUrl:
          type:
          - string
          - 'null'
        vendorLogoUrl:
          type:
          - string
          - 'null'
        vendorLogoThumbmailUrl:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        shortDescription:
          type:
          - string
          - 'null'
        longDescription:
          type:
          - string
          - 'null'
        isPublic:
          type: boolean
        maxConnectionCount:
          type: integer
          format: int32
      additionalProperties: false
    MasterKeyProductsResponseModel:
      type: object
      properties:
        id:
          type: integer
          format: int32
        productName:
          type:
          - string
          - 'null'
      additionalProperties: false
    EciIntegrationProductResponseModelAPIResponse:
      type: object
      properties:
        version:
          type:
          - string
          - 'null'
        statusCode:
          type: integer
          format: int32
        message:
          type:
          - string
          - 'null'
        responseException:
          allOf:
          - $ref: '#/components/schemas/ApiError'
        result:
          allOf:
          - $ref: '#/components/schemas/EciIntegrationProductResponseModel'
      additionalProperties: false
    ValidationError:
      type: object
      properties:
        field:
          type:
          - string
          - 'null'
        message:
          type:
          - string
          - 'null'
      additionalProperties: false
    SystemRequestModel:
      type: object
      properties:
        integrationName:
          type:
          - string
          - 'null'
        systemName:
          maxLength: 25
          type:
          - string
          - 'null'
        isActive:
          type:
          - boolean
          - 'null'
        canBeCreatedByAdmin:
          type:
          - boolean
          - 'null'
        vendorName:
          type:
          - string
          - 'null'
        vendorUrl:
          type:
          - string
          - 'null'
        vendorLogoUrl:
          type:
          - string
          - 'null'
        vendorLogoThumbmailUrl:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        shortDescription:
          type:
          - string
          - 'null'
        longDescription:
          type:
          - string
          - 'null'
        isPublic:
          type:
          - boolean
          - 'null'
        maxConnectionCount:
          type:
          - integer
          - 'null'
          format: int32
      additionalProperties: false
    EciIntegrationResponseAPIResponse:
      type: object
      properties:
        version:
          type:
          - string
          - 'null'
        statusCode:
          type: integer
          format: int32
        message:
          type:
          - string
          - 'null'
        responseException:
          allOf:
          - $ref: '#/components/schemas/ApiError'
        result:
          allOf:
          - $ref: '#/components/schemas/EciIntegrationResponse'
      additionalProperties: false
    SystemImportRequestModel:
      required:
      - systemName
      type: object
      properties:
        id:
          type: integer
          format: int32
        systemName:
          maxLength: 25
          minLength: 1
          type: string
        isActive:
          type: boolean
        canBeCreatedByAdmin:
          type: boolean
        vendorName:
          type:
          - string
          - 'null'
        vendorUrl:
          type:
          - string
          - 'null'
        vendorLogoUrl:
          type:
          - string
          - 'null'
        vendorLogoThumbmailUrl:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        shortDescription:
          type:
          - string
          - 'null'
        longDescription:
          type:
          - string
          - 'null'
        isPublic:
          type: boolean
        maxConnectionCount:
          type: integer
          format: int32
      additionalProperties: false
    IntegrationMasterKeyDetail:
      type: object
      properties:
