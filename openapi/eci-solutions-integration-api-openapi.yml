          - 'null'
          format: int32
        dataType:
          type:
          - string
          - 'null'
        isSecret:
          type: boolean
        maskType:
          type:
          - string
          - 'null'
        displayName:
          type:
          - string
          - 'null'
        hostingEnvironment:
          type: integer
          format: int32
        validationPattern:
          type:
          - string
          - 'null'
        validationPatternMessage:
          type:
          - string
          - 'null'
        dropdownValues:
          type:
          - array
          - 'null'
          items:
            type: string
        isUpdateableOnConnection:
          type: boolean
        displayOrdinal:
          type: integer
          format: int32
        validationExpression:
          type:
          - string
          - 'null'
        isVisibleOnConnection:
          type: boolean
        isReadOnly:
          type: boolean
        description:
          type:
          - string
          - 'null'
        isConnectionSpecific:
          type: boolean
        products:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/MasterKeyProductsResponseModel'
        systemId:
          type:
          - integer
          - 'null'
          format: int32
        systemName:
          type:
          - string
          - 'null'
      additionalProperties: false
    ProductsResponseModel:
      type: object
      properties:
        id:
          type: integer
          format: int32
        productName:
          type:
          - string
          - 'null'
        displayname:
          type:
          - string
          - 'null'
        shortDescription:
          type:
          - string
          - 'null'
        longDescription:
          type:
          - string
          - 'null'
        maxConnectionCount:
          type:
          - integer
          - 'null'
          format: int32
        isPublic:
          type:
          - boolean
          - 'null'
