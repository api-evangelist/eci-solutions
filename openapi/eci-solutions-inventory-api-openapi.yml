      title: Project
      type: object
      properties:
        name:
          type: string
          example: Birch Towers
        projectId:
          type: string
          example: 123
    Pricing:
      title: Pricing
      type: object
      description: Sets the pricing information for the inventory in Lasso. Setting all fields to 0 except the `initialPrice` allows you to specify an exact sales price.
      required:
      - initialPrice
      properties:
        initialPrice:
          type: number
          description: Base price of inventory
          example: '4300000'
        adjustedGrossPrice:
          type: number
          example: '-50000'
        offTheTopDiscount:
          type: number
          example: '-10000'
        inLieuOfIncentive:
          type: number
          example: '10000'
        credit:
          type: number
          example: '25000'
        _links:
          type: object
          properties:
            self:
              type: string
              example: /inventory/123-123/pricing
            update:
              type: string
              example: /inventory/123-123/pricing
    Dates:
      title: Dates
      type: object
      description: All dates are in the ISO 8601 UTC format, limited to year, month and day (YYYY-MM-DD). Will set all dates to blank if not provided.
      properties:
        contract:
          type: string
          format: date
          example: '2017-08-05'
        acceptance:
          type: string
          format: date
          example: '2017-08-08'
        completion:
          type: string
          format: date
          example: '2017-08-11'
        release:
          type: string
          format: date
          example: '2017-08-08'
        possession:
          type: string
          format: date
          example: '2017-08-15'
        occupancy:
          type: string
          format: date
          example: '2017-08-19'
        sendToLawyer:
          type: string
          format: date
          example: '2017-08-12'
        adjustment:
          type: string
          format: date
          example: '2017-08-30'
        _links:
          type: object
          properties:
            self:
              type: string
              example: /inventory/123-123/dates
            update:
              type: string
              example: /inventory/123-123/dates
    ParkingStall:
      title: Parking Stall
      properties:
        uniqueId:
          type: string
          example: '077'
        price:
          type: number
          example: '12000'
        date:
          type: string
          format: date
          example: '2017-08-30'
        paymentReceivedDate:
          type: string
          format: date
          example: '2017-08-30'
        outsideOfContract:
          type: boolean
          example: true
        description:
          type: string
          example: Part of storage package
    Deposit:
      title: Deposit
      required:
      - amount
      - dueDate
      properties:
        depositId:
          type: string
          example: '123'
        amount:
          type: number
          example: '145000'
        dueDate:
          type: string
          format: date
          example: '2017-08-30'
        amountReceived:
          type: number
          example: '145000'
        receivedDate:
          type: string
          format: date
          example: '2017-09-10'
    Component:
      title: Component
      type: object
      properties:
        name:
          type: string
          example: Birch Towers
        componentId:
          type: string
          example: 123
    RealtorCompensation:
      type: object
      properties:
        bonuses:
          type: array
          items:
            type: number
            example: '10000.00'
        percentages:
          type: array
          items:
            type: object
            properties:
              cutOff:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - under
                    - over
                    example: under
                  value:
                    type: number
                    example: '100000'
              margin:
                type: number
                description: Percentage as fraction of 100 as float, e.g. '0.0125' => 1.25%
                example: '0.022'
    Option:
      type: object
      required:
      - name
      - price
      properties:
        name:
          type: string
          example: Marble counter tops
        description:
          type: string
          example: Upgrade for kitchen counter tops
        price:
          type: number
          example: '1000'
        area:
          type: string
          example: Kitchen
          description: Areas have to be set up in Lasso, they are matched via string. If no area is found, one will be created.
        date:
          type: string
          format: date
          example: '2017-08-29'
        outsideContract:
          type: boolean
          example: true
    BicycleLocker:
      title: Bicycle Locker
      properties:
        uniqueId:
          type: string
          example: '077'
        price:
          type: number
          example: '12000'
        date:
          type: string
          format: date
          example: '2017-08-30'
        paymentReceivedDate:
          type: string
          format: date
          example: '2017-08-30'
        outsideOfContract:
          type: boolean
          example: true
        description:
          type: string
          example: Part of storage package
    Realtor:
      type: object
      required:
      - firstName
      - lastName
      - company
      properties:
        realtorId:
          type: string
          example: '123'
        nameTitle:
          type: string
          example: Mrs
        firstName:
          type: string
          example: Susan
        lastName:
          type: string
          example: Smith
        email:
          type: string
          example: susan.smith@example.com
        fax:
          type: string
          example: (604) 123-1234
        phone:
          type: string
          example: (604) 555-1234
        company:
          type: string
          example: Realtor Inc
        address:
          type: string
          example: 123 Street
        city:
          type: string
          example: Vancouver
        province:
          type: string
          example: BC
        postalCode:
          type: string
          example: V6V1T1
        country:
          type: string
          example: Canada
        gender:
          type: string
          enum:
          - unspecified
          - male
          - female
          example: female
        compensation:
          $ref: '#/components/schemas/RealtorCompensation'
    InventoryUpdate:
      title: InventoryUpdate
      properties:
        statusOverwrite:
          type: string
          description: Current status of inventory. Will default to existing value if not provided.
          enum:
          - Available
          - Unavailable
          - Reserved
          - Subject
          - Firm
          - Firm(R)
          - Offer
          - Closed
          example: Available
        plan:
          type: string
          example: E2
          description: This field has to be set up in Lasso. It is matched to an existing option via the name. If no existing option is found, a new one is created. Will default to existing value if not provided.
        squareFootage:
          type: number
          example: 1251
          description: Will default to existing value if not provided.
        patioSquareFootage:
          type: number
          example: 70
          description: Will default to existing value if not provided.
        colorScheme:
          type: string
          example: Beige
          description: This field has to be set up in Lasso. It is matched to an existing option via the name. If no existing option is found, a new one is created. Will default to existing value if not provided.
        maintenanceFee:
          type: number
          example: '351.12'
          description: Will default to existing value if not provided.
        floor:
          type: number
          example: 11
          description: Will default to existing value if not provided.
        bedrooms:
          type: string
          example: 2 Bedroom + Den
          description: This field has to be set up in Lasso. It is matched to an existing option via the name. If no existing option is found, a new one is created. Will default to existing value if not provided.
        bathrooms:
          type: string
          example: 2 1/2
          description: Will default to existing value if not provided.
        direction:
          type: string
          example: SE
          description: This field has to be set up in Lasso. It is matched to an existing option via the name. If no existing option is found, a new one is created. Will default to existing value if not provided.
        exposure:
          type: string
          example: South East
          description: This field has to be set up in Lasso. It is matched to an existing option via the name. If no existing option is found, a new one is created. Will default to existing value if not provided.
        definition:
          type: string
          enum:
          - Unit
          - Townhome
          - Lot
          - Homesite
          example: Unit
          description: Will default to existing value if not provided.
        dates:
          $ref: '#/components/schemas/Dates'
        pricing:
          $ref: '#/components/schemas/Pricing'
        _links:
          type: object
          properties:
            self:
              type: string
              example: /inventory/123-123
            delete:
              type: string
              example: /inventory/123-123
        strataLot:
          type: string
          example: 123
          minLength: 1
          maxLength: 15
        inventoryNumber:
          type: string
          example: 123
          minLength: 1
          maxLength: 11
  securitySchemes:
    JwtAuthorizer:
      type: http
      scheme: bearer
      bearerFormat: JWT
