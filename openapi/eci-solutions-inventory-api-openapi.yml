    Subject:
      type: object
      required:
      - purchaser
      - subjectDate
      - description
      properties:
        purchaser:
          type: string
          example: '123'
          description: RegistrantId of a registrant assigned to the inventory
        subjectDate:
          type: string
          format: date
          example: '2017-08-14'
        description:
          type: string
          example: Adjust doors that do not close properly
        removed:
          type: boolean
          example: false
        removalDate:
          type: string
          format: date
          example: '2017-08-25'
        removalDescription:
          type: string
          example: Contractor sanded doors, all close properly now
