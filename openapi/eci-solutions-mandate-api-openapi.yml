openapi: 3.2.0
info:
  title: Einvoice. Mandate API
  version: '1.0'
security:
- Bearer: []
tags:
- name: Mandate
paths:
  /api/v1/mandates:
    get:
      tags:
      - Mandate
      summary: Get a list of country mandates, optionally filtered by a single mandate name
      operationId: ListMandates
      parameters:
      - name: mandateName
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/EinvoiceGetMandateResponseListResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/EinvoiceGetMandateResponseListResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/EinvoiceGetMandateResponseListResponse'
components:
  schemas:
    EinvoiceGetMandateResponseListResponse:
      type: object
      properties:
        count:
          type: integer
          format: int32
        data:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/EinvoiceGetMandateResponse'
      additionalProperties: false
    EinvoiceGetMandateResponse:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
        countryCode:
          type:
          - string
          - 'null'
        mandateName:
          type:
          - string
          - 'null'
        mandateDescription:
          type:
          - string
          - 'null'
        documentDownloadTypes:
          type:
          - array
          - 'null'
          items:
            type: string
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: oauth2
      description: OAuth 2.0 Client Credentials Flow with API Users issued from Integration Engine Management Console
      flows:
        clientCredentials:
          tokenUrl: https://api-user.integrations.ecimanufacturing.com/oauth2/api-user/token
          scopes:
            openid: openid
