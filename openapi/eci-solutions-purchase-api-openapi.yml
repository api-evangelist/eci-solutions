        mainContact:
          allOf:
          - $ref: '#/components/schemas/Contact'
          description: "The main contact of this customer.\n* ECI Financials: Contacts collection\n* Xero:\n    - FirstName = Supplier.FirstName\n    - LastName = Supplier.LastName\n    - PrimairyPhone = Supplier.PhoneTypeEnum.Default\n    - Fax = Supplier.PhoneTypeEnum.Fax\n    - MobilePhone = Supplier.PhoneTypeEnum.Mobile\n    - Email = Supplier.EmailAddress\n* TripleTex: \n    - Id = Contact.Id\n    - FirstName LastName = Contact.DisplayName\n    - PhoneMobile = Contact.PhoneNumberMobile\n    - PhonePrimairy = Contact.PhoneNumberWork\n* AccountView: Contacts collection\n* PowerOfficeGo:\n    - Id = Contact.Id\n    - code = Contact.ExternalCode\n    - FirstName = Contact.FirstName\n    - LastName = Contact.LastName\n    - PhonePrimary = Contact.PhoneNumber\n    - Email = Contact.EmailAddress\n    - Dob = Contact.DataOfBirth\n* AfasSB: \n    - Id = Contact.Id\n    - Code = Contact.ExternalId\n    - Email = Contact.EmailAddress\n    - FirstName = Contact.FirstName\n    - LastName = Contact.LastName\n    - PhonePrimary = Contact.PhoneNumber\n    - Initials = Contact.Initials\n    - LastNamePrefix = Contact.Prefix\n* Sage50Uk: \n    - Id = Contact.ContactId\n    - FirstName = Contact.Name\n    - LastNamePrefix = Contact.Name\n    - LastName = Contact.Name\n    - PhonePrimary = Contact.Telephone\n* Adsolut:\n    - Id = Contact.Id\n    - FirstName = Contact.FirstName\n    - LastName = Contact.LastName\n    - PhonePrimary = Contact.PhonePrimary\n    - PhoneMobile = Contact.ModiblePhone\n    - Fax = Contact.Fax\n    - Email = Contact.EmailAddress\n    - Dob = Contact.DateOfBirth"
        bankAccount:
          allOf:
          - $ref: '#/components/schemas/BankAccount'
          description: "The bank account of this customer. \n* ECI Financials: Company properties\n* Xero: \n    - BankAccountDetails = BankAccount.AccountNumber\n    - BatchPayments.BankAccountNumber = BankAccount.Number;\n    - BankAccountDetails = BankAccount.Number; \n    - BatchPayments.BankAccountName = BankAccount.BankName;\n* TripleTex:\n    - BankAccount.Bic = BankAccountPresentation.Bic\n    - BankAccount.Iban = BankAccountPresentation.Iban \n    - BankAccount.Country BankAccountPresentation.Country.IsoAlpha2Code\n* AccountView: Company properties\n* PowerOfficeGo:\n    - BankAccount.Id = BankAccount.Id\n    - BankAccount.Bic = BankAccount.BicSwift\n    - BankAccount.Number = BankAccount.Code\n    - BankAccount.Iban = BankAccount.Code\n    - BankAccount.Country = BankAccount.CountryCode\n* AfasSB:\n    - BankAccount.Iban = BankAccount.AccountNumber\n    - BankAccount.BankName = BankAccount.BankId\n    - BankAccount.Bic = BankAccount.Bic\n    - BankAccount.Country = BankAccount.CountryCode\n    - true = BankAccount.PreferredIncomingPayments\n    - true = BankAccount.PreferredOutgoingPayments\n* Sage50Uk:\n    - BankAccount.Number = Customer.BankAccountNumber\n    - BankAccount.Bic = Customer.BicSwift\n    - BankAccount.Iban = Customer.Iban\n* Adsolut:\n    - BankAccount.Bic = BankAccount.BicCode\n    - BankAccount.Iban = BankAccount.Iban"
