        postalAddress:
          allOf:
          - $ref: '#/components/schemas/Address'
          description: "The address where all mail should be sent.\n* ECI Financials: Company.BillingAddress & Company.PostalAddress\n* Xero: AddressTypeEnum.POBOX\n* TripleTex: Supplier.PostalAddress\n* AccountView: Company.BillingAddress & Company.PostalAddress\n* PowerOfficeGo: Supplier.MailAddress\n* AfasSB: \n    - City = Address.CityName\n    - Country = Address.CountryCode\n    - HouseNumber = Address.HouseNumber\n    - HouseNumberExtension = Address.HouseNumberAddition\n    - PostalCode = Address.PostalZone\n    - StateProv = Address.State\n    - Street = Address.StreetName\n    - true = Address.PreferredBillingAddress\n* Sage50Uk: Supplier.DefaultAddress\n* Adsolut: Supplier.PostalAddress"
