          - 'null'
        statusCode:
          type: integer
          format: int32
        message:
          type:
          - string
          - 'null'
        responseException:
          allOf:
          - $ref: '#/components/schemas/ApiError'
        result:
          allOf:
          - $ref: '#/components/schemas/AddReportParametersResponseModel'
      additionalProperties: false
    ValidationError:
      type: object
      properties:
        field:
          type:
          - string
          - 'null'
        message:
          type:
          - string
          - 'null'
      additionalProperties: false
    ReportRequestModel:
      type: object
      properties:
        sourceId:
          type: integer
          format: int32
        data:
          allOf:
          - $ref: '#/components/schemas/ReportPostData'
      additionalProperties: false
    ReportListResponseModelAPIResponse:
      type: object
