        validationPattern:
          type:
          - string
          - 'null'
        validationPatternMessage:
          type:
          - string
          - 'null'
        dropdownValues:
          type:
          - string
          - 'null'
        isRequired:
          type: boolean
      additionalProperties: false
    ReportListResponseModel:
      type: object
      properties:
        id:
          type: integer
          format: int32
        reportName:
          type:
          - string
          - 'null'
        queryType:
          type:
          - string
          - 'null'
        integrationId:
          type:
          - integer
          - 'null'
          format: int32
        integrationName:
          type:
          - string
          - 'null'
        roles:
          type:
          - array
          - 'null'
          items:
            type: integer
            format: int32
        isActive:
          type: boolean
        useDateRange:
          type: boolean
      additionalProperties: false
    ReportParameterResponseModel:
      type: object
      properties:
        reportParameterId:
          type: integer
          format: int32
        displayName:
          type:
