          - 'null'
        statusCode:
          type: integer
          format: int32
        message:
          type:
          - string
          - 'null'
        responseException:
          allOf:
          - $ref: '#/components/schemas/ApiError'
        result:
          allOf:
          - $ref: '#/components/schemas/AddUpdateReportResponseModel'
      additionalProperties: false
    AddReportParametersResponseModel:
      type: object
      properties:
        reportParameterId:
          type: integer
          format: int32
        reportId:
          type: integer
          format: int32
        parameterName:
          type:
          - string
          - 'null'
        displayName:
          type:
          - string
          - 'null'
        dataType:
          type:
          - string
          - 'null'
        minValue:
          type:
          - integer
          - 'null'
          format: int32
        maxValue:
          type:
          - integer
          - 'null'
