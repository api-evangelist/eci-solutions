  /api/v2/sales-outstanding-items:
    get:
      tags:
      - Sales
      summary: Get a list of outstanding items for sales
      description: 'Get a list of outstanding items for sales.


        **TripleTex** The take and skip parameter is not reliable and results may vary with usage.

        **Sage 50 UK** The take and skip parameter is not supported. All items are allways retrieved'
      parameters:
      - name: take
        in: query
        description: The maximum number of records to retrieve. If not provided, retrieve the number of records allowable by the backend financial system, which is not guaranteed to be the entire set of records.
        schema:
          type: integer
          format: int32
      - name: skip
        in: query
        description: The number of records to skip past when retrieving the list. Recommended to be a multiple of the Take value, if provided.
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
