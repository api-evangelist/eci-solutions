  /api/Setting/SaveAccount:
    post:
      tags:
      - Setting
      summary: Create or update an Account
      description: Supported by MYOB, QBO, Xero, and Sage.
      requestBody:
        description: A model with Account details.
        content:
          application/json-patch+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/AccountModel'
              description: 'Represents a GL Account to be saved to the financial system.

                QBO: https://developer.intuit.com/app/developer/qbo/docs/api/accounting/all-entities/account

                Xero: https://developer.xero.com/documentation/api/accounting/accounts

                MYOB: https://developer.myob.com/api/myob-business-api/v2/generalledger/account/

                Sage: https://developer.sage.com/accounting/reference/accounting-setup/#tag/Ledger-Accounts'
