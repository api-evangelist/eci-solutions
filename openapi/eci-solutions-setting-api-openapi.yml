                Sage: https://developer.sage.com/accounting/reference/accounting-setup/#tag/Ledger-Accounts'
          application/*+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/AccountModel'
              description: 'Represents a GL Account to be saved to the financial system.

                QBO: https://developer.intuit.com/app/developer/qbo/docs/api/accounting/all-entities/account

