openapi: 3.2.0
info:
  title: Financial Integration Setting API
  description: 'Common Financial Package API supporting Quickbooks Online, Xero, and MYOB.


    ## Authentication

    Pass an access token in the HTTP Authorization header of each request. For example:


    ```Authorization: Bearer [token]```


    Access tokens are obtained from the Authentication API. See the Authentication API token endpoint for more information.'
  contact:
    name: ECI Integration Team
    url: https://www.ecisolutions.com/support/
  version: v1
security:
- Bearer: []
tags:
- name: Setting
paths:
  /api/Setting/Account/{id}:
    delete:
      tags:
      - Setting
      summary: Delete an Account
      description: Supported by MYOB, QBO, and Xero.
      parameters:
      - name: id
        in: path
        description: account id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/StringAPIResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/StringAPIResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/StringAPIResponse'
      operationId: deleteApiSettingAccountById
      x-operation-id-source: derived
  /api/Setting/GetAccount/{id}:
    get:
      tags:
      - Setting
      summary: Get a single Account by unique id, if it exists
      description: Supported by MYOB, QBO, Xero, and Sage.
      parameters:
      - name: id
        in: path
        description: The id of the Account to find.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ChartAccountResponseModelAPIResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ChartAccountResponseModelAPIResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ChartAccountResponseModelAPIResponse'
      operationId: getApiSettingGetAccountById
      x-operation-id-source: derived
  /api/Setting/GetAccounts:
    get:
      tags:
      - Setting
      summary: Get a list of Accounts
      description: 'Supported by MYOB, QBO, Xero, and Sage.

        Take value, if provided, must be between 1 and 100. Skip value, if provided, must be greater than or equal to 0.'
      parameters:
      - name: ModifiedAfter
        in: query
        description: If provided, only return records modified after this date and time. Only supported for QBO at this time.
        schema:
          type: string
          format: date-time
      - name: Take
        in: query
        description: The maximum number of records to retrieve. If not provided, retrieve the number of records allowable by the backend financial system, which is not guaranteed to be the entire set of records.
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
      - name: Skip
        in: query
        description: The number of records to skip past when retrieving the list. Recommended to be a multiple of the Take value, if provided.
        schema:
          maximum: 2147483647
          minimum: 0
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ChartAccountResponseModelListAPIResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ChartAccountResponseModelListAPIResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ChartAccountResponseModelListAPIResponse'
      operationId: getApiSettingGetAccounts
      x-operation-id-source: derived
