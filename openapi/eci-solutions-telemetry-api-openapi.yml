openapi: 3.2.0
info:
  title: MFG Integration Management Telemetry API
  description: Provides APIs for managing ECI MFG Integration Engine Configurations.
  contact:
    name: ECI Manufacturing Integration Team
    url: https://www.ecisolutions.com/support/
  version: 2.22.273+b02c1dfd00
servers:
- url: https://api-user.integrations.ecimanufacturing.com:443
  description: Production
security:
- oidc:
  - openid
- Basic: []
tags:
- name: Telemetry
paths:
  /api/audit-logs:
    get:
      tags:
      - Telemetry
      summary: This API is used to fetch history of all changes made to a company, so that I…
      description: 'Accessible By: Global Admin, Product Admin, Product Support User, Company Manager.\

        Accessed From: User Mgmt UI.\

        Description: This API is used to fetch history of all changes made to a company, so that I can determine who and when a change was made.'
      operationId: GetAuditLogTelemetry
      parameters:
      - name: product_id
        in: query
        description: Set the product id to define the particular product
        schema:
          type: integer
          format: int32
      - name: company_id
        in: query
        description: Set the company id to define the particular company
        schema:
          type: integer
          format: int32
      - name: duration
        in: query
        description: Set duration in minutes to perform search
        schema:
          type: integer
          format: int32
      - name: start_date
        in: query
        description: Set UTC start_date in format like {YYYY-MM-DDTHH:MM:SS}
        schema:
          type: string
          format: date-time
      - name: end_date
        in: query
        description: Set UTC end_date in format like {YYYY-MM-DDTHH:MM:SS}
        schema:
          type: string
          format: date-time
      - name: take
        in: query
        description: Set number of records to fetch from database at a time. Default value is 100
        schema:
          maximum: 1000
          minimum: 1
          type: integer
          format: int32
          default: 100
      - name: skip
        in: query
        description: Set number of records to skip which should not come from database
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AuditLogResponseIListAPIResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogResponseIListAPIResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AuditLogResponseIListAPIResponse'
