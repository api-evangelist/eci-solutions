  /api/telemetry/report/{id}:
    get:
      tags:
      - Telemetry
      summary: Gets a list of logs or UM DB data based on selected query type like DSL, SQL
      description: 'Accessible By: Global Admin, Product Admin, Product Support User, Company Manager.\

        Accessed From: User Mgmt UI.\

        Description: Gets a list of logs or UM DB data based on selected query type like DSL, SQL.'
      operationId: GetCustomLogReportTelemetry
      parameters:
      - name: id
        in: path
