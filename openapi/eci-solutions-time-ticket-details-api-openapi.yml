            example:
              allowClosedJobs: false
              billingRate: 0
              comments: string
              cycleTime: 0
              jobNumber: string
              machinesRun: 0
              numberMachinesForJob: 0
              operationNumber: 0
              overTime: false
              payrollRate: 0
              piecesFinished: 0
