openapi: 3.2.0
info:
  title: JobBOSS² Public Time Ticket Details API
  description: Provides a common API surface for accessing ECI ERP JobBOSS².
  version: v1
servers:
- url: https://api-jb2.integrations.ecimanufacturing.com:443
  description: API Host
security:
- Bearer: []
tags:
- name: Time Ticket Details
paths:
  /api/v1/time-ticket-details:
    get:
      tags:
      - Time Ticket Details
      summary: Gets a list of Time Ticket Details
      description: 'By default a time ticket detail response will include only the fields: actualPayRate, billingRate, comments, cycleTime, employeeCode, employeeName, jobNumber, machineHours, machinesRun, manHours, numberMachinesForJob, onlineID, operationNumber, payrollRate, piecesFinished, piecesScrapped, setupTime, shift, stepNumber, ticketDate, timeTicketGUID, uniqueID, workCenter. You may specify the exact fields to return using the fields parameter.'
      parameters:
      - name: fields
        in: query
        description: A comma separated list of fields to include in the result.
        schema:
          type: string
      - name: sort
        in: query
        description: A comma separated list of field to sort by.
        schema:
          type: string
      - name: filters
        in: query
        description: Filters must be provided as query string parameters as defined in the <a href='#filter-expressions'>Filter Expressions</a> section.
        schema:
          type: object
          additionalProperties:
            type: string
        examples:
          No filters: {}
          Filter by Employee:
            value:
              employeeCode: '101'
      - name: skip
        in: query
        description: The number of records at the start of the result set to skip over.
        schema:
          type: string
      - name: take
        in: query
        description: The number of records to retrieve.
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeTicketDetailListSuccessResponse'
              example:
                Data:
                - actualPayRate: 0
                  adjustedPayRate: 0
                  allowClosedJobs: false
                  attendanceDetailID: 0
                  attendanceHeaderID: 0
                  billingRate: 0
                  burdenRate: 0
                  comments: string
                  createdBy: string
                  customerRMANumber: string
                  cycleRate: 0
                  cycleTime: 0
                  deviceNumber: 0
                  employeeCode: 0
                  employeeName: string
                  isMaterialAllocated: false
                  jobNumber: string
                  lastModDate: '2026-09-06T17:13:13.0000000+00:00'
                  lastModUser: string
                  logoffTime: '2026-09-06T17:13:13.0000000+00:00'
                  machineHours: 0
                  machinesRun: 0
                  manHours: 0
                  nextWorkCenter: string
                  numberMachinesForJob: 0
                  onlineID: 0
                  operationNumber: 0
                  overTime: false
                  payrollRate: 0
                  piecesFinished: 0
                  piecesScrapped: 0
                  posted: false
                  reasonNumber: 0
                  searchDate: 0
                  setupRate: 0
