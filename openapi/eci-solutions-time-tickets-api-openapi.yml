        comments:
          type:
          - string
          - 'null'
        cycleTime:
          type:
          - number
          - 'null'
          format: double
        jobNumber:
          type: string
        machinesRun:
          type:
          - integer
          - 'null'
          format: int32
        numberMachinesForJob:
          type:
          - number
          - 'null'
          format: double
        operationNumber:
          type:
          - integer
          - 'null'
