gaps:
  - >-
    No official SDK exists for the ECI Manufacturing ERP API (146 operations), JobBOSS² (142), M1
    (1,208) or Lasso CRM (68). For a provider shipping ~2,000 documented operations across eighteen
    contracts, an integrator writes the HTTP client themselves in every language.
  - >-
    No SDKs pointer is emitted in apis.yml, deliberately: sdk_count counts FIRST-PARTY libraries and
    ECI has none. Recording the community packages here without claiming them as ECI's own is the
    honest reading.
