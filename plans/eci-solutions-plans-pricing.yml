description: >-
  ECI Software Solutions publishes NO pricing for its software and NO pricing, metering or quota
  scheme for any of its eighteen public APIs. There is no plans page, no per-call price, no included
  quota and no overage rate anywhere on ecisolutions.com, the ECI Manufacturing developer portal or
  the Lasso API reference. Every product page ends in "Get a demo" or "Let's talk", and
  www.ecisolutions.com/pricing/ redirects to the Customer Center support portal rather than to a
  price. The developer portal states the commercial gate plainly: "All APIs must be activated by ECI
  before use. Please contact your Account Manager or support for more information on activating
  APIs." Whether API access carries a separate charge, is bundled into the ERP subscription, or is
  negotiated per customer is not disclosed.
plans: []
note: >-
  This file previously carried three scaffold tiers (Free / Professional / Enterprise) with invented
  request quotas and rate limits written by the 2026-05-04 bulk sweep. They were never published by
  ECI. They are removed here and replaced with the measured result: plan_count 0, contact-sales.
  Lasso CRM is the one place a tier boundary is even named — its description distinguishes a free
  "Lasso Registration" API key that can only add registrants from the fuller "Lasso Pro API" — but
  no price is attached to either, so neither is recorded as a plan.
